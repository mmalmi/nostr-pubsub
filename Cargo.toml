[workspace]
members = [
  "crates/nostr-pubsub-reconcile",
  "crates/nostr-pubsub",
  "crates/nostr-pubsub-fips",
  "crates/nostr-pubsub-relay",
  "crates/nostr-pubsub-sim",
  "crates/nostr-pubsub-social-graph",
]
resolver = "2"

[workspace.package]
version = "0.1.14"
edition = "2024"
license = "MIT"
authors = ["Nostr Pubsub contributors"]
repository = "https://github.com/mmalmi/nostr-pubsub"

[workspace.dependencies]
async-trait = "0.1"
nvpn-fips-core = { version = "=0.4.124" }
nvpn-fips-tcp = { version = "=0.2.6" }
nvpn-fips-tcp-endpoint = { version = "=0.2.58" }
nostr = { version = "0.44.3", features = ["nip44"] }
nostr-sdk = "0.44.1"
nostr-pubsub = { version = "0.1.23", path = "crates/nostr-pubsub" }
nostr-pubsub-reconcile = { version = "0.1.4", path = "crates/nostr-pubsub-reconcile" }
nostr-pubsub-social-graph = { version = "0.3.2", path = "crates/nostr-pubsub-social-graph" }
nostr-social-graph = "0.2.4"
nostr-social-memory = "0.2.1"
nostr-social-graph-hashtree = "0.2.0"
serde = { version = "1", features = ["derive"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1.50", features = ["full"] }
uuid = "1"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[workspace.lints.rust]
unsafe_code = "forbid"
